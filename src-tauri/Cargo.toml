[package]
name = "magpie"
version = "0.1.0"
description = "MAGPIE — Needle painting design tool for embroidery"
authors = ["Colton Batts"]
edition = "2021"

[lib]
name = "magpie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
